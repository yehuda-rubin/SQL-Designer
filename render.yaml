services:
  # Backend Service (Flask API)
  - type: web
    name: sql-designer-backend
    env: python
    region: frankfurt  # EU region (קרוב לישראל)
    buildCommand: "./build.sh"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --chdir Backend app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sql-designer-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false  # Will be set manually after frontend is deployed

  # Frontend Service (React/Vite)
  - type: web
    name: sql-designer-frontend
    env: static
    buildCommand: "cd Frontend && npm install && npm run build"
    staticPublishPath: ./Frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Will be set manually after backend is deployed

# Database
databases:
  - name: sql-designer-db
    region: frankfurt
    plan: free  # Free PostgreSQL database
    databaseName: sql_designer
    user: sql_designer_user